# gcloud builds submit --config deploy/api/cloudbuild.yaml --substitutions=_REGION=us-central1 .
# _REPO defaults to the Artifact Registry repository collector/README.md creates.
substitutions:
  _REGION: us-central1
  _REPO: options
  _IMAGE: api
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/api/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest", "."]
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
options:
  logging: CLOUD_LOGGING_ONLY
