# gcloud builds submit --config collector/cloudbuild.yaml --substitutions=_REGION=us-central1 .
substitutions:
  _REGION: us-central1
  _REPO: options
  _IMAGE: collector
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "collector/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest", "."]
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
# A trigger run as a chosen service account must say where its logs go; Cloud
# Logging needs no bucket of its own (the account needs roles/logging.logWriter).
options:
  logging: CLOUD_LOGGING_ONLY
